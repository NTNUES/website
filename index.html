      { id: "2026-01-04", title: "2026/05/29 地科系學會期末會員大會", date: "2026/05/20", departments: ["會長股"], content: `各位會員好\n\n本會將於2026年05月29日（星期五） 12:30 舉行本學期期末會員大會，地點為公館校區理學院E301教室。\n\n本次會議將進行本會114學年活動回顧及財務報告，另有發放歐趴糖，歡迎會員踴躍參與。若需訂購午餐請填寫以下表單：https://forms.gle/Ay443kigDh1BxCDF8\n\n祝 期末順利\n\n會長 簡志諭`, file: { name: "期末會員大會會議通知.pdf", link: "https://drive.google.com/file/d/12xcsFZq6CP-IWZ275JubaLatgRca2rty/view?usp=sharing" } },
      { id: "2026-99-02", title: "2026/06/12 地科大大家聚", date: "2026/05/16", departments: ["轉知"], content: `【大家聚｜前導篇】\n\n-\n\n🦸🏻‍♂️：誒誒誒！你有聽說嗎？今年那個傳說中的活動要復活了！\n\n🧑🏻‍🌾：蛤？什麼東西復活？恐龍喔？\n\n🦸🏻‍♂️：比恐龍還稀有——可以免費吃好料的活動！\n\n🧑🏻‍🌾：等等，你是說那個一年一度、大家會聚在一起的活動嗎？\n\n🦸🏻‍♂️：對！就是它！睽違已久，強勢回歸！\n\n🧑🏻‍🌾：可是……要社交欸，我光想到就開始耗電。\n\n🦸🏻‍♂️：別怕！這不是普通社交，這是「邊吃邊社交」，難度直接下降 80%。\n\n🧑🏻‍🌾：聽起來好像有點可以……\n\n🦸🏻‍♂️：而且免費吃、免費玩、免費認識大家，這不是活動，這是福報。\n\n🧑🏻‍🌾：你這樣講我突然覺得不去好像會虧。\n\n🦸🏻‍♂️：沒錯！人生可以錯過復興幹線，但不能錯過免費好料。\n\n🧑🏻‍🌾：好啦好啦，那我要去哪裡報名？\n\n🦸🏻‍♂️：連結就在下面啊！快去報名吧！\n\n-\n\n誒嘿沒錯，就是免費吃好料的時間啦！\n\n不快點手刀報名～\n\n-\n\n⏰ 時間：2026/06/12（五）17:30 ~ 21:30\n\n📍 地點：饗食天堂 信義店\n\n💰 費用：大一至大三免費參加！\n\n-\n\n報名連結：\n\nhttps://forms.gle/qsp8X9QERL6aDAmS7\n\n-\n\n注意事項：\n\n大家請注意報名時間，只到2026/05/22 23:59\n\n因為名額有限，請大家儘早報名，如有異動會提前通知～\n\n當天下午如果有課或考試的話，請寫完再過來用餐，請為自己負責！`, file: null },
      { id: "2026-99-01", title: "葉庭光老師基隆嶼夜釣體驗與魚類生態調查探究活動", date: "2026/05/13", departments: ["轉知"], content: `基隆嶼 夜釣體驗 與魚類生態調查探究活動\n\n活動時間 預計於6月13日或6月14日 傍晚17:00~21:00，包船\n自行前往基隆八斗子漁港集合與解散\n若有困難，可協助叫車或安排搭便車(4人共乘單程約200~250/人)\n預計 出海 費用約1200元，多退，少不須補\n務必攜帶身分證件\n\n聯絡人：葉庭光 0955698738\nhttps://forms.gle/xyUrgfkF3de3x66r6`, file: null },
      { id: "2026-03-03", title: "2026/5/15 地科系系躲貓貓", date: "2026/05/08", departments: ["活動股"], content: `大家午安\n我是系躲貓貓總籌 地科117張鈞幃\n\n我們預計在5/15（五）晚上在公館校區舉辦系躲貓貓（真的躲貓貓）\n會有躲貓貓以及宵夜🍽️補充體力\n\n大家樓頂揪樓下、厝邊揪隔壁一起來玩😍😍\n\n報名連結：https://forms.gle/tqnUvqnJwNFgg4pa6`, file: null },
      { id: "2026-03-02", title: "2026/5/15 系躲報名開始", date: "2026/05/04", departments: ["活動股"], content: `想在忙碌課業中放鬆一下嗎？\n一起來躲貓貓吧！\n不只可以紓壓放鬆\n還能找到素未蒙面的同學✨\n在遊戲中認識彼此\n而且還有美味宵夜😋\n邊玩邊吃，快樂直接加倍！\n\n日期: 2026/05/15 星期五\n時間: 18:30-21:30\n地點: E101\n費用:非會員90元/人 會員65元/人\n\n報名表單：\nhttps://forms.gle/tqnUvqnJwNFgg4pa6`, file: null },
      { id: "2026-09-04", title: "第四十三屆正副會長改選結果", date: "2026/04/17", departments: ["選委會"], content: `本次正副會長改選投票率29.5%，投票結果如下：\n同意票：45票\n不同意票：2票\n廢票：2票\n\n根據本會選罷法，同意票大於不同意票且投票率達五分之一\n恭喜當選🎉期待未來的系學會持續發光發熱，一起創造更多精彩回憶！`, file: null },
      { id: "2026-01-03", title: "119級伯樂大學堂輔導員甄選", date: "2026/04/16", departments: ["會長股"], content: `大家早安\n119級伯樂大學堂要來囉～\n想認識更多人、挑戰自己、創造屬於大學的難忘回憶嗎？\n有興趣擔任輔導員趕快來填表單報名吧！\n\n📅報名截止：4/27（一）19：00 逾時不候 \n📬錄取通知：4/30（四）前以Email發送通知，未錄取不另行通知\n\n🔗連結傳送門👉\nhttps://forms.gle/yhD7AhJrZZ3QjM1T7`, file: null },

      { id: "2026-09-01", title: "地球科學系學會第43屆正副會長改選時程", date: "2026/04/02", departments: ["選委會"], content: `本次選委會名單為：簡志諭（主席）、李冠廷、郭傲寒、張鈞幃、林佳泓\n開放候選人登記時間：4/2 00:00 至 4/8 20:17\n改選說明會（E101）：4/2 12:30-13:10 \n候選人與政見公布：4/9 至 4/16\n候選人政見發表會（E101）：4/10 12:30-13:10\n投票日（線上投票）：4/17 9:00-17:00`, file: null },
      { id: "2026-05-01", title: "水上運動會報名", date: "2026/04/02", departments: ["體育股"], content: `大家好，這邊向大家宣布水上運動會今天開始報名了，報名時間為現在開始到4/23日，活動時間為5/22(五)為了方便報名流程，以下表單我會統計到4/20的23:59分。方便我處理後續流程。請有興趣的同學踴躍報名！\n\n水運會項目如下:\n個人單項\n水中摸象(撿象棋抽獎，當場報名)\n趣味競賽(水上拔河)\n智慧鐵人兩項(腳踏車跟游泳)\n\n本次水運會報名說明簡報與報名表單:\nhttps://docs.google.com/forms/d/e/1FAIpQLSfDFU3x_QGMAbvbe3hqhRrd10q9OYQfgOGzS4U4sEGYsq5bAg/viewform?usp=publish-editor\n\n相關活動內容與詳細比賽方法及秩序冊在本次水運會報名說明會議簡報中，請有興趣的同學多加利用。\n簡報連結:\nhttps://www.canva.com/design/DAGkk8vS7sE/qaqlv0-FuzFXMcGD5QhRmQ/edit`, file: null },
      { id: "2026-01-02", title: "會長改選說明會+歐趴糖", date: "2026/03/30", departments: ["會長股", "公關股"], content: `大家早安\n4/2(四) 12:30 E101舉行會長改選說明會+領歐趴糖\n歡迎對於擔任會長有興趣的人可以來聽\n預祝大家期中順利`, file: null },
      { id: "2026-03-01", title: "2026地科展", date: "2026/03/26", departments: ["活動股"], content: `2026地科展將於2026年4月25日舉行\n📅 2026 年 4 月 25 日（六）09:30–16:30\n📍 師大公館校區\n👉 活動詳情請見：https://youb1707.wixsite.com/ntnues2026openhouse`, file: null },
      { id: "2026-01-01", title: "2026/3/6 地科系學會期初會員大會", date: "2026/02/13", eventDate: "2026/03/06", departments: ["會長股"], content: `各位會員好\n\n本會將於2026年3月6日(星期五) 12:30 舉行第二學期期初會員大會，地點為理學院E301教室。\n\n本次會議將進行本學期活動預告，並針對「組織章程」及「選舉罷免辦法」進行修訂與投票，詳細內容請見附檔。由於涉及重要章程之變更，請具備投票權（繳交會費）的會員務必撥冗出席，以利會務推動。同時，也歡迎所有會員一同參與會議，針對章程或選罷法修訂內容提出指教與建議。\n\n另外附上便當訂購表單連結：https://forms.gle/bg5Cnbr54byRr47e6\n\n祝 新年快樂\n\n會長 簡志諭`, file: { name: "地科系學會114學年度第二學期期初會員大會會議通知0213.pdf", link: "https://drive.google.com/file/d/1JYig36P-qsEbUqmeqSKU4i5yZEXOYfBs/view?usp=share_link" } },
      { id: "2025-01-01", title: "二〇二五臺師大四系聯合耶誕晚會space1225協辦系購票", date: "2025/10/01", departments: ["會長股"], content: `大家早安\n四系聯合耶誕晚會早鳥票開始購票了喔\n地科系會員價370/張\n非會員優惠價400/張\n不要猶豫了🫵 \n\nℹ️耶晚資訊\n臺師大四系聯合耶誕晚會SPACE❶㊁②㊄\n日期｜2025/12/20 （Sat.）\n時間｜17:00入場 ⁞ 18:00開始\n地點｜臺師大和平校區 綜合體育館四樓\n藝人｜請見 ＠ntnuspace1225\n表單連結｜https://forms.gle/webANJUzrkyBzpjA8\n地科系為協辦並協助宣傳｜有任何問題歡迎私訊地科系學會IG(@ntnu_es)`, file: null },
      { id: "2025-03-02", title: "四系聯合迎新烤肉｜生科 × 地科 × 營養 × 化學", date: "2025/09/10", departments: ["活動股"], content: `🔥【四系聯合迎新烤肉｜生科 × 地科 × 營養 × 化學】🔥\n\n新的學期、新的開始，怎麼能少了最熱鬧的迎新活動？\n今年我們結合了 生科、地科、營養、化學 四大系，準備一場絕對不容錯過的—— 迎新烤肉派對！ 🥓🥬🥤\n\n在這裡，你可以：\n✨ 認識不同科系的新朋友，拓展人脈！\n✨ 在滿滿烤肉香中，享受美食與歡笑！\n\n📅活動時間｜10/2（四）18:30-21:30\n📍活動地點｜華中露營場\n💰費用｜正式會員350元；非會員400元\n報名資格｜四系在學學生，118級新生優先\n繳費時間與地點｜\n9/19 （五）  12:30-13:30 學二交誼廳\n9/22（一）  12:30-13:30 學二交誼廳\n\n帶著期待與好奇，來跟我們一起點燃這個夜晚吧！\n不管你是新生、舊生，都歡迎加入這場跨系盛會～但名額只有20人，要來要快！\n—————————————————————\n⚠️報名人數超出預期，會以有繳會費者優先錄取，再來才是以填表單順序來錄取\n👉 報名連結：https://forms.gle/8CUCkE44P3377iCc9`, file: null },
      { id: "2025-05-01", title: "女排場地使用資訊", date: "2025/09/10", departments: ["體育股"], content: `本學期女排跟物理系女排一起使用場地，若有想加入的人可以找體育股獲得相關資訊`, file: null },
      { id: "2025-03-01", title: "新生宿營", date: "2025/09/05", departments: ["活動股"], content: `轉達\n大家好我是宿營總籌林佳泓，踏入全新的大學生活，還在思考要參加什麼活動、或擔心無法跟同學變熟的朋友們別煩惱了🦊🐰🦊🐰🦊🐰屬於你們的第一個重要活動「新生宿營」要來啦！\n本次由「東亞× 地科× 台文」聯合舉辦「台扯啦!地東裡怎麼有隻穿警裝的兔子?!」新生宿營，各位將化身成動物方城市的探員👮🏻‍♂️👮🏻，和新朋友們共同破解任務，一起合作、奔跑、尖叫🗣️🗣️🗣️!！\n在大家彼此還不太熟悉之時，宿營就是認識同學的最佳機會，透過RPG闖關、水大地、烤肉晚會等豐富活動，加上共同住宿一晚的特別體驗，不僅能快速拉近彼此距離，還能交到不同科系的好友～說不定，還會能在宿營裡收穫愛情呢！😲😍🥰👥🫂\n\n宿營詳細資訊：\n📍地點：雷朗極限探索（249新北市八里區忠五街70號）\n📆時間：2025年9月20至21日（兩天一夜）\n💰費用：2400（有交會費的只要2300！）\n🔗連結：https://docs.google.com/forms/d/e/1FAIpQLSdDDtGD01LfycYZ8iYgwm5TRhD5dPJnjCJgFMgVopx_t6YD9Q/viewform?usp=header\n\n有任何問題都歡迎直接聯絡我～\n還在猶豫的朋友們心動不如馬上行動，千萬別錯過這個屬於大一的第一個精彩篇章，快來加入本次的聯合新生宿營吧，後續也會有更詳細的行前通知！`, file: null },
      { id: "2025-04-01", title: "系學會費繳交通知", date: "2025/09/02", departments: ["總務股"], content: `大家早安\n我是第42屆地球科學系學會總務 張鈞幃\n\n恭喜大家展開新一學期的大學生活！\n我們會因應不同節日，籌辦許多娛樂或是體育類別的活動！為了讓大家有釋放壓力與表現活力的舞台，學會也極力支持各系隊的運作。系上刊物或是系服都代表著地科系，學會這邊也盡我們所能積極出品！每位地科系學生都是我們的基本會員，為了維護大家的權益、讓大家能夠體驗到更美好的活動，需要酌收系學會費，運用在不論是系學術，抑或是舉辦各個活動之中！\n\n詳細的收支會全部透明化，並在每學期末公開細項與結餘，鞏固大家的權益並且讓經費有安全的流向！\n\n當然，為了保障大家的選擇權，我們提供同學繳費年期的選擇。若先繳一年會費，金額為$700，連續繳兩年會費金額為$1400，如此類推，若想一次繳五年會費，金額為$3500。\n\n預祝大家能夠開開心心、度過新一學期的大學生活！\n\n以下為系學會專用之郵局帳戶資訊：\n郵局代號：700\n帳號：0001972 0090269\n\n匯款成功後請填寫回覆表單，之後也會開立收據\n\n回覆表單連結:https://forms.gle/dZDAmqKX3bM8wVWp8\n\n目前開了幾個時段大家可以來繳費\n9/5  12:30-14:00\n9/8  12:30-14:00\n9/12 12:30-14:00\n\n另外，如果時間都對不上，也可以在之後找總務繳交系費\n\n若您有任何繳費相關問題，歡迎隨時與系學會長聯繫\n\n總務 張鈞幃、徐秉辰`, file: null },
      { id: "2024-04-01", title: "系躲報名開始", date: "2024/09/07", departments: ["總務股"], content: `哈囉大家午安\n我們這學期最後一個活動 系躲開始報名啦\n快點把握機會 手刀填表單🫵\n贏家還會有小獎勵🎁\n活動結束之後還有美味的甜點可以享用喔😋\n\nℹ️系躲資訊\n活動日期：11月21日（四）\n活動時間：17:30~20:00\n活動地點：師大分部（集合時間：17:30/集合地點：S102)\n報名費用：會員$60/非會員$90\n繳費時間：11/11、11/15、11/18、11/19、11/20（確切繳費時間請看IG精選「⏰提醒」，地點：學二交誼廳）\n表單報名期限：11/14（四）23:59\n報名表單：https://forms.gle/RuKQkD5ZQKMKktwdA`, file: null }
    ];

    // Firebase hooks
    const useViewCount = (announcementId) => {
      const [count, setCount] = useState(null);
      useEffect(() => {
        const ref = db.ref(`views/${announcementId}`);
        ref.on('value', (snapshot) => setCount(snapshot.val() || 0));
        return () => ref.off();
      }, [announcementId]);
      const increment = () => {
        const sessionKey = `viewed_${announcementId}`;
        if (!sessionStorage.getItem(sessionKey)) {
          db.ref(`views/${announcementId}`).transaction((c) => (c || 0) + 1);
          sessionStorage.setItem(sessionKey, 'true');
        }
      };
      return { count, increment };
    };

    const useOverallSiteViews = () => {
      const [totalViews, setTotalViews] = useState(0);
      useEffect(() => {
        const sessionKey = 'viewed_site_overall';
        if (!sessionStorage.getItem(sessionKey)) {
          db.ref('views/overall_site_views').transaction((c) => (c || 0) + 1);
          sessionStorage.setItem(sessionKey, 'true');
        }
        const ref = db.ref('views/overall_site_views');
        ref.on('value', (snapshot) => setTotalViews(snapshot.val() || 0));
        return () => ref.off();
      }, []);
      return totalViews;
    };

    // HeroCarousel
    const HeroCarousel = ({ onNavigate }) => {
      const slides = eventsData;
      const [current, setCurrent] = useState(0);
      const timeoutRef = useRef(null);
      const resetTimeout = () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
      useEffect(() => {
        resetTimeout();
        timeoutRef.current = setTimeout(() => setCurrent((p) => p === slides.length - 1 ? 0 : p + 1), 5000);
        return () => resetTimeout();
      }, [current]);
      const next = (e) => { if(e) e.stopPropagation(); setCurrent(c => c === slides.length-1 ? 0 : c+1); };
      const prev = (e) => { if(e) e.stopPropagation(); setCurrent(c => c === 0 ? slides.length-1 : c-1); };
      return (
        <div className="relative w-full h-[300px] md:h-[500px] lg:h-[600px] overflow-hidden mb-12 group bg-slate-100 dark:bg-gray-800 cursor-pointer">
          <div className="w-full h-full flex transition-transform duration-700 ease-out" style={{ transform: `translateX(-${current * 100}%)` }} onClick={() => onNavigate('events')}>
            {slides.map((slide) => (
              <div key={slide.id} className="min-w-full h-full relative">
                <img src={slide.image} alt={slide.title} className="w-full h-full object-cover" referrerPolicy="no-referrer" onError={(e) => { e.target.onerror=null; e.target.src="https://placehold.co/1920x1080/e2e8f0/64748b?text=Image+Loading+Error"; }} />
                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
                <div className="absolute bottom-0 left-0 w-full p-6 md:p-12 text-white">
                  <div className="max-w-5xl mx-auto border-l-4 border-white pl-4 md:pl-6">
                    <span className="block text-sm md:text-lg font-medium tracking-wider mb-2 text-blue-200 drop-shadow-md">{slide.date}</span>
                    <h2 className="font-display text-2xl md:text-5xl drop-shadow-md flex flex-wrap items-center gap-3 leading-tight tracking-wide">
                      {slide.title}
                      {slide.subtitle && <span className="text-lg md:text-2xl font-light opacity-90 block w-full mt-1">{slide.subtitle}</span>}
                      <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm bg-white/20 p-1.5 rounded-full mt-2"><ArrowRight size={24} /></span>
                    </h2>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <button onClick={prev} className="absolute top-1/2 left-4 -translate-y-1/2 bg-black/20 hover:bg-black/40 backdrop-blur-sm text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 border border-white/20 z-10"><ChevronLeft size={32} /></button>
          <button onClick={next} className="absolute top-1/2 right-4 -translate-y-1/2 bg-black/20 hover:bg-black/40 backdrop-blur-sm text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 border border-white/20 z-10"><ChevronRight size={32} /></button>
          <div className="absolute bottom-6 right-8 flex gap-3 z-10">
            {slides.map((_, idx) => <button key={idx} onClick={(e) => { e.stopPropagation(); setCurrent(idx); }} className={`h-2.5 rounded-full transition-all duration-300 border border-white/50 shadow-sm ${current === idx ? 'bg-white w-10' : 'bg-white/30 w-2.5 hover:bg-white/60'}`} />)}
          </div>
        </div>
      );
    };

    // AnnouncementAccordion
    const AnnouncementAccordion = ({ announcement }) => {
      const [isOpen, setIsOpen] = useState(false);
      const { count, increment } = useViewCount(announcement.id);
      const attachments = announcement.files || (announcement.file ? [announcement.file] : []);

      // 判斷是否為 7 天內的新公告
      const isNew = (() => {
        const parts = announcement.date.split('/');
        if (parts.length < 3) return false;
        const pubDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        const now = new Date();
        return (now - pubDate) / (1000 * 60 * 60 * 24) <= 7;
      })();

      const formatContent = (content) => {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const grayRegex = /<gray>(.*?)<\/gray>/g;
        const fileRegex = /\[FILE:(.*?)\|(.*?)\]/g;
        return content.split('\n').map((line, i) => {
          const grayParts = line.split(grayRegex);
          return (
            <React.Fragment key={i}>
              {grayParts.map((text, idx) => {
                if (idx % 2 === 1) return <span key={idx} className="text-gray-400 dark:text-gray-500 text-sm font-medium">{text}</span>;
                const fileParts = text.split(fileRegex);
                return fileParts.map((part, k) => {
                  if (k % 3 === 1) { const name = part; const link = fileParts[k+1]; return <a key={`f${k}`} href={link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2 my-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:text-[#003B71] dark:hover:text-blue-400 hover:border-[#003B71] dark:hover:border-blue-400 transition-colors shadow-sm"><Download size={16} />附檔：{name}</a>; }
                  if (k % 3 === 2) return null;
                  return part.split(urlRegex).map((urlPart, j) => urlPart.match(urlRegex) ? <a key={j} href={urlPart} target="_blank" rel="noopener noreferrer" className="text-blue-600 dark:text-blue-400 hover:underline break-all">{urlPart}</a> : urlPart);
                });
              })}
              <br />
            </React.Fragment>
          );
        });
      };

      const formattedDate = announcement.date.replace(/\//g, '-');
      const handleToggle = () => { const opening = !isOpen; setIsOpen(opening); if (opening) increment(); };

      return (
        <div className="border-b border-gray-200 dark:border-gray-700">
          <button onClick={handleToggle} className={`w-full px-4 py-3 md:py-4 flex flex-col md:flex-row items-start md:items-center text-left transition-colors focus:outline-none group gap-2 md:gap-0 ${isOpen ? 'bg-blue-50/50 dark:bg-gray-800/80' : 'bg-white dark:bg-gray-900 hover:bg-slate-50 dark:hover:bg-gray-800/50'}`}>
            <div className="w-full md:w-32 text-sm font-medium text-gray-700 dark:text-gray-300 md:text-center shrink-0 flex items-center md:block">
              <span className="md:hidden mr-2 text-xs font-bold text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">日期</span>
              {formattedDate}
            </div>
            <div className="flex-1 text-[#003399] dark:text-blue-400 font-bold md:px-2 flex flex-wrap items-center gap-x-1.5 gap-y-1">
              <span className="group-hover:underline leading-snug break-words">{announcement.title}</span>
              {attachments.length > 0 && <Paperclip size={13} className="text-gray-400 shrink-0" />}
              {isNew && (
                <span className="text-[10px] font-bold text-white bg-red-500 px-1.5 py-0.5 rounded-sm tracking-wider shrink-0">NEW</span>
              )}
            </div>
            <div className="w-full md:w-28 shrink-0 flex items-center mt-1 md:mt-0 md:justify-center">
              <div className="flex items-center md:block md:text-center">
                <span className="md:hidden mr-2 text-xs font-bold text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">單位</span>
                <span className="text-sm text-gray-600 dark:text-gray-400">
                  {announcement.departments[0]}
                </span>
              </div>
            </div>
            <div className="w-full md:w-16 text-sm shrink-0 flex items-center justify-between md:justify-center mt-1 md:mt-0">
              <div className="flex items-center gap-1 md:justify-center">
                <span className="md:hidden mr-2 text-xs font-bold text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">瀏覽</span>
                <Eye size={13} className="text-gray-400 dark:text-gray-500 shrink-0" />
                <span className="font-mono text-gray-500 dark:text-gray-400">
                  {count !== null ? count : '-'}
                </span>
              </div>
              <div className={`md:hidden text-gray-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : 'rotate-0'}`}><ChevronDown size={18} /></div>
            </div>
          </button>
          <div className={`grid transition-[grid-template-rows] duration-500 ease-in-out ${isOpen ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
            <div className="overflow-hidden">
              <div className="px-4 py-6 bg-slate-50/50 dark:bg-gray-800/40 border-t border-gray-100 dark:border-gray-800">
                <div className="text-gray-700 dark:text-gray-300 leading-relaxed text-justify text-sm md:text-base whitespace-pre-wrap md:ml-[136px]">{formatContent(announcement.content)}</div>
                {attachments.length > 0 && (
                  <div className="mt-4 md:ml-[136px] flex flex-wrap gap-3">
                    {attachments.map((file, idx) => <a key={idx} href={file.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:text-[#003B71] dark:hover:text-blue-400 hover:border-[#003B71] dark:hover:border-blue-400 transition-colors shadow-sm"><Download size={16} />附檔：{file.name}</a>)}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // AnnouncementsSection
    const AnnouncementsSection = () => {
      const [selectedYears, setSelectedYears] = useState([]);
      const [selectedDepts, setSelectedDepts] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const years = Array.from(new Set(announcementsData.map(a => a.date.split('/')[0]))).sort((a, b) => b.localeCompare(a));
      const depts = ['會長股', '公關股', '活動股', '總務股', '體育股', '美宣股', '器攝股', '學術股', '選委會', '轉知'];
      const handleYearChange = (y) => setSelectedYears(p => p.includes(y) ? p.filter(x => x !== y) : [...p, y]);
      const handleDeptChange = (d) => setSelectedDepts(p => p.includes(d) ? p.filter(x => x !== d) : [...p, d]);
      const filteredData = announcementsData.filter(a => {
        const year = a.date.split('/')[0];
        const matchYear = selectedYears.length === 0 || selectedYears.includes(year);
        const matchDept = selectedDepts.length === 0 || a.departments.some(d => selectedDepts.includes(d));
        const matchSearch = searchQuery.trim() === '' || 
          a.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          a.content.toLowerCase().includes(searchQuery.toLowerCase());
        return matchYear && matchDept && matchSearch;

                <a key={doc.id} href={doc.link} target="_blank" rel="noreferrer" className={`w-full px-4 py-3 md:py-4 flex flex-col md:flex-row items-start md:items-center text-left transition-colors group gap-2 md:gap-0 border-b border-gray-200 dark:border-gray-700 hover:bg-blue-50/50 dark:hover:bg-gray-800/80 ${rowBg}`}>
                  <div className="w-full md:w-32 text-sm font-medium text-gray-700 dark:text-gray-300 md:text-center shrink-0 flex items-center md:block">
                    <span className="md:hidden mr-2 text-xs font-bold text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">日期</span>{formattedDate}
                  </div>
                  <div className="flex-1 text-[#003399] dark:text-blue-400 font-bold pr-4"><span className="group-hover:underline leading-snug break-all">{doc.title}</span></div>
                  <div className="w-full md:w-24 text-sm md:text-center shrink-0 flex items-center mt-1 md:mt-0">
                    <span className="md:hidden mr-2 text-xs font-bold text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">格式</span>
                    <span className={`${tagBg} text-white text-[11px] px-2 py-0.5 rounded-sm tracking-wider`}>{doc.type}</span>
                  </div>
                  <div className="w-full md:w-28 text-sm md:text-center shrink-0 flex items-center mt-1 md:mt-0">
                    <span className="md:hidden mr-2 text-xs font-bold text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">檔案</span>
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md text-xs font-medium text-gray-700 dark:text-gray-300 group-hover:text-[#003B71] dark:group-hover:text-blue-400 group-hover:border-[#003B71] dark:group-hover:border-blue-400 transition-colors shadow-sm ml-auto md:ml-0 md:mx-auto"><Download size={14} /> 點此下載</span>
                  </div>
                </a>
              );
            })}
          </div>
        </div>
      );
    };

    // 後台密碼（可自行更改，但這在原始碼中可見，請勿用重要密碼）
    const ADMIN_PASSWORD = "es42admin";

    // App
    function App() {
      const [activeTab, setActiveTab] = useState('intro');
      useOverallSiteViews();

      // 手機版選單
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // 回到頂部按鈕
      const [showBackToTop, setShowBackToTop] = useState(false);
      useEffect(() => {
        const handleScroll = () => setShowBackToTop(window.scrollY > 400);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);
      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      // 後台密碼保護
      const [adminUnlocked, setAdminUnlocked] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState(false);

      const handlePasswordSubmit = () => {
        if (passwordInput === ADMIN_PASSWORD) {
          setAdminUnlocked(true);
          setShowPasswordModal(false);
          setPasswordInput('');
          setPasswordError(false);
          setActiveTab('admin');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          setPasswordError(true);
          setPasswordInput('');
        }
      };

      // 後台隱藏觸發：連點 footer logo 5次
      const footerClickCount = useRef(0);
      const footerClickTimer = useRef(null);
      const handleFooterLogoClick = () => {
        footerClickCount.current += 1;
        if (footerClickTimer.current) clearTimeout(footerClickTimer.current);
        footerClickTimer.current = setTimeout(() => { footerClickCount.current = 0; }, 2000);
        if (footerClickCount.current >= 5) {
          footerClickCount.current = 0;
          if (adminUnlocked) {
            setActiveTab('admin');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            setShowPasswordModal(true);
            setPasswordError(false);
            setPasswordInput('');
          }
        }
      };

      const [isDarkMode, setIsDarkMode] = useState(() => {
        if (typeof window !== 'undefined' && window.localStorage) return localStorage.getItem('theme') === 'dark';
        return false;
      });
      useEffect(() => {
        if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
        else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
      }, [isDarkMode]);
      useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); setMobileMenuOpen(false); }, [activeTab]);

      const navItems = [
        { id: 'intro', label: '主頁' },
        { id: 'announcements', label: '公告' },
        { id: 'events', label: '活動回顧' },
        { id: 'history', label: '學會歷史' },
        { id: 'members', label: '成員介紹' },
        { id: 'docs', label: '相關文件' },
      ];

      const renderContent = () => {
        switch (activeTab) {
          case 'intro': return <IntroSection onNavigate={setActiveTab} />;
          case 'announcements': return <AnnouncementsSection />;
          case 'events': return <EventsSection />;
          case 'history': return <HistorySection />;
          case 'members': return <MembersSection />;
          case 'docs': return <DocsSection />;
          case 'admin': return <AdminSection />;
          default: return <IntroSection onNavigate={setActiveTab} />;
        }
      };

      return (
        <div className="min-h-screen bg-white dark:bg-gray-900 text-[#1a1a1a] dark:text-gray-100 pb-12 flex flex-col transition-colors duration-300">

          {/* 密碼保護 Modal */}
          {showPasswordModal && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-sm" onClick={() => setShowPasswordModal(false)}>
              <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-80 mx-4" onClick={(e) => e.stopPropagation()}>
                <h3 className="text-xl font-bold text-[#003B71] dark:text-blue-400 mb-2 text-center">後台管理</h3>
                <p className="text-sm text-gray-500 dark:text-gray-400 text-center mb-6">請輸入密碼以繼續</p>
                <input
                  type="password"
                  value={passwordInput}
                  onChange={(e) => { setPasswordInput(e.target.value); setPasswordError(false); }}
                  onKeyDown={(e) => e.key === 'Enter' && handlePasswordSubmit()}
                  placeholder="輸入密碼"
                  autoFocus
                  className={`w-full px-4 py-3 rounded-lg border text-sm focus:outline-none focus:ring-2 dark:bg-gray-700 dark:text-gray-100 mb-2 transition-colors
                    ${passwordError ? 'border-red-400 focus:ring-red-300 dark:border-red-500' : 'border-gray-300 focus:ring-[#003B71]/30 dark:border-gray-600'}`}
                />
                {passwordError && <p className="text-xs text-red-500 mb-3 text-center">密碼錯誤，請再試一次</p>}
                <div className="flex gap-3 mt-4">
                  <button onClick={() => { setShowPasswordModal(false); setPasswordInput(''); setPasswordError(false); }}
                    className="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    取消
                  </button>
                  <button onClick={handlePasswordSubmit}
                    className="flex-1 py-2.5 rounded-lg bg-[#003B71] dark:bg-blue-600 text-white text-sm font-bold hover:bg-[#002a52] dark:hover:bg-blue-700 transition-colors">
                    確認
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 回到頂部按鈕 */}
          <button
            onClick={scrollToTop}
            className={`back-to-top ${showBackToTop ? 'visible' : ''} w-12 h-12 bg-[#003B71] dark:bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-[#002a52] dark:hover:bg-blue-700 transition-colors`}
            title="回到頂部"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="m18 15-6-6-6 6"/>
            </svg>
          </button>
          <header className="sticky top-0 z-50 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-b border-gray-100 dark:border-gray-800 shadow-sm transition-colors duration-300">
            <div className="py-4">
              <div className="max-w-5xl mx-auto px-4 md:px-6">
                <div className="flex items-center justify-between gap-2 md:gap-4 w-full">
                  <div className="flex items-center gap-3 md:gap-4 min-w-0">
                    <img src="https://drive.google.com/thumbnail?id=1ujWbQzO9oNH5ZV2_VNS4ZXo8UiSkTyeA&sz=w400" alt="系學會 Logo" className="w-12 h-12 md:w-16 md:h-16 rounded-full object-cover shadow-sm border border-gray-100 dark:border-gray-700 bg-white shrink-0" referrerPolicy="no-referrer" />
                    <div className="flex flex-col items-start min-w-0">
                      <span className="text-[9px] sm:text-xs font-medium text-gray-500 dark:text-gray-400 tracking-[0.05em] sm:tracking-[0.15em] uppercase font-bold truncate w-full">National Taiwan Normal University</span>
                      <h1 className="font-display text-xl sm:text-2xl md:text-3xl text-[#003B71] dark:text-white truncate w-full tracking-wide">地球科學系學會</h1>
                    </div>
                  </div>
                  <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 md:p-2.5 rounded-full bg-slate-100 dark:bg-gray-800 text-slate-600 dark:text-gray-300 hover:bg-slate-200 dark:hover:bg-gray-700 transition-colors shadow-sm focus:outline-none shrink-0" title={isDarkMode ? "切換至淺色模式" : "切換至深色模式"}>
                    {isDarkMode ? <Sun size={20} className="w-4 h-4 md:w-5 md:h-5" /> : <Moon size={20} className="w-4 h-4 md:w-5 md:h-5" />}
                  </button>
                </div>
              </div>
            </div>
            <div className="border-t border-gray-100 dark:border-gray-800">
              <div className="max-w-5xl mx-auto px-4 md:px-6">
                {/* 電腦版導覽列 */}
                <nav className="hidden md:flex justify-start space-x-8">
                  {navItems.map((item) => (
                    <button key={item.id} onClick={() => setActiveTab(item.id)}
                      className={`py-4 text-sm tracking-widest transition-all duration-300 border-b-2 font-medium whitespace-nowrap
                        ${activeTab === item.id ? 'border-[#003B71] text-[#003B71] dark:border-blue-400 dark:text-blue-400' : 'border-transparent text-gray-400 hover:text-gray-800 dark:hover:text-gray-200'}`}>
                      {item.label}
                    </button>
                  ))}
                </nav>
                {/* 手機版漢堡選單按鈕 */}
                <div className="flex md:hidden items-center justify-between py-2">
                  <span className="text-sm font-medium text-gray-500 dark:text-gray-400 tracking-widest">
                    {navItems.find(i => i.id === activeTab)?.label || '主頁'}
                  </span>
                  <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 text-gray-500 dark:text-gray-400 hover:text-[#003B71] dark:hover:text-blue-400 transition-colors focus:outline-none">
                    {mobileMenuOpen ? (
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    ) : (
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                    )}
                  </button>
                </div>
              </div>
              {/* 手機版展開選單 */}
              {mobileMenuOpen && (
                <div className="md:hidden border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-lg">
                  {navItems.map((item) => (
                    <button key={item.id} onClick={() => { setActiveTab(item.id); setMobileMenuOpen(false); }}
                      className={`w-full px-6 py-3.5 text-left text-sm font-medium transition-colors border-l-4
                        ${activeTab === item.id ? 'border-[#003B71] text-[#003B71] bg-blue-50/50 dark:border-blue-400 dark:text-blue-400 dark:bg-gray-800/50' : 'border-transparent text-gray-600 dark:text-gray-300 hover:bg-slate-50 dark:hover:bg-gray-800/50'}`}>
                      {item.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </header>

          <main className="w-full flex-grow">{renderContent()}</main>

          <footer className="bg-slate-50 dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-20 pt-16 pb-12 transition-colors duration-300">
            <div className="max-w-5xl mx-auto px-6 text-center">
              <div className="flex flex-col items-center gap-8">
                <div>
                  {/* 連點5次進後台 */}
                  <div className="mb-3 cursor-default select-none" onClick={handleFooterLogoClick}>
                    <span className="font-display text-2xl text-[#003B71] dark:text-white tracking-widest">NTNU Earth Sciences</span>
                  </div>
                  <p className="text-sm text-gray-500 dark:text-gray-400 mb-1">國立臺灣師範大學 地球科學系學會</p>
                  <p className="text-xs text-gray-400 dark:text-gray-500 tracking-widest">© {new Date().getFullYear()} All Rights Reserved.</p>
                </div>
                <div className="space-y-4 flex flex-col items-center w-full max-w-md">
                  <h4 className="font-bold text-gray-900 dark:text-gray-100 tracking-wide uppercase text-sm border-b border-gray-200 dark:border-gray-600 pb-2 inline-block">聯絡我們 Contact Us</h4>
                  <div className="space-y-3 text-sm text-gray-600 dark:text-gray-300 w-full">
                    <p>地址 (11677) 台北市文山區汀州路四段88號（公館校區）</p>
                    <p><a href="mailto:ntnues42@gmail.com" className="hover:text-[#003B71] dark:hover:text-blue-400 transition-colors">email ntnues42@gmail.com</a></p>
                    <p><a href="https://www.facebook.com/ntnuessa" target="_blank" rel="noreferrer" className="hover:text-[#003B71] dark:hover:text-blue-400 transition-colors">Facebook 國立臺灣師範大學 地球科學系學會</a></p>
                    <p><a href="https://instagram.com/ntnu_es" target="_blank" rel="noreferrer" className="hover:text-[#003B71] dark:hover:text-blue-400 transition-colors">IG ntnu_es</a></p>
                  </div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
